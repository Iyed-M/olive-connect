# Production-like stack: web (nginx + React build) -> api (Spring Boot) -> mongo, redis.
# Run:  docker compose -f deploy/docker-compose.yml up --build
# Then open http://localhost (or http://localhost:$HTTP_PORT if port 80 is busy).
# VPS deployment with login and HTTPS (TLS) comes later, in milestone M13.
name: oliveconnect

services:
  web:
    build: ../frontend
    ports:
      - "${HTTP_PORT:-80}:80"   # the only published port
    depends_on:
      api:
        condition: service_healthy   # nginx needs the api hostname to exist at startup
    networks: [front, back]
    restart: unless-stopped

  api:
    build: ../backend
    environment:
      MONGO_URI: mongodb://mongo:27017/oliveconnect?replicaSet=rs0
      REDIS_HOST: redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s   # Spring Boot takes a few seconds to start
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [back]
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]   # replica set is needed for transactions (M5)
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # First run: create the replica set with the container name as host.
      # Later runs: rs.status() succeeds and nothing is changed.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    networks: [back]     # no ports: only the api can reach it
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back]     # no ports: only the api can reach it
    restart: unless-stopped

networks:
  front:            # reachable from the host (web publishes port 80 here)
  back:
    internal: true  # no route to the internet; the api, mongo and redis need none

volumes:
  mongo-data:
  redis-data:
