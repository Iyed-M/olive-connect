# Production stack for the VPS and for the local production smoke test.
# Copy deploy/.env.example to deploy/.env and replace every example secret.
# Local smoke test: docker compose -f deploy/docker-compose.yml up --build
name: oliveconnect

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mongo-keyfile-init:
    image: alpine:3.20
    command:
      - /bin/sh
      - -ec
      - |
        keyfile=/keyfile/mongodb-keyfile
        if [ ! -s "$$keyfile" ]; then
          umask 177
          head -c 756 /dev/urandom | base64 | tr -d '\\n' > "$$keyfile"
          chmod 400 "$$keyfile"
        fi
        chown 999:999 "$$keyfile"
        chmod 400 "$$keyfile"
        test -r "$$keyfile"
    volumes:
      - mongo-keyfile:/keyfile
    restart: "no"
    logging: *default-logging

  web:
    build:
      context: ../frontend
      dockerfile: ../deploy/nginx/Dockerfile
    environment:
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      TLS_DOMAIN: ${TLS_DOMAIN:-localhost}
      INTRANET_ALLOWED_IP: ${INTRANET_ALLOWED_IP:-192.0.2.1/32}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${LETSENCRYPT_DIR:-./letsencrypt}:/etc/letsencrypt:ro
      - nginx-tls:/etc/nginx/tls
      - nginx-logs:/var/log/nginx
      - ./nginx/entrypoint.sh:/usr/local/bin/oliveconnect-nginx-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/oliveconnect-nginx-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      api:
        condition: service_healthy
    networks: [front, back, monitoring]
    restart: unless-stopped
    logging: *default-logging

  api:
    build: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGO_URI: "mongodb://${MONGO_APP_USER:-oliveconnect}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in deploy/.env}@mongo:27017/oliveconnect?replicaSet=rs0&authSource=oliveconnect"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env (at least 32 characters)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in deploy/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in deploy/.env}
      IMPORT_INBOX_DIR: /data/inbox
    volumes:
      - inbox-data:/data/inbox
      - api-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [back, monitoring]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging

  mongo:
    image: mongo:7.0.14
    command:
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /etc/mongo-keyfile/mongodb-keyfile
      - --auth
      - --wiredTigerCacheSizeGB
      - "1"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in deploy/.env}
      MONGO_INITDB_DATABASE: oliveconnect
      MONGO_APP_USER: ${MONGO_APP_USER:-oliveconnect}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in deploy/.env}
      MONGO_EXPORTER_USER: ${MONGO_EXPORTER_USER:-exporter}
      MONGO_EXPORTER_PASSWORD: ${MONGO_EXPORTER_PASSWORD:?Set MONGO_EXPORTER_PASSWORD in deploy/.env}
      MONGO_BACKUP_USER: ${MONGO_BACKUP_USER:-backup}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:?Set MONGO_BACKUP_PASSWORD in deploy/.env}
    volumes:
      - mongo-data:/data/db
      - mongo-keyfile:/etc/mongo-keyfile:ro
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin
          --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    networks: [back]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
    networks: [back]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
    networks: [monitoring, back]
    restart: unless-stopped
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [monitoring]
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${TLS_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LOG_MODE: console file
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks: [front, monitoring]
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [monitoring]
    restart: unless-stopped
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - api-logs:/var/log/api:ro
      - nginx-logs:/var/log/nginx:ro
      - promtail-positions:/tmp
    depends_on:
      - loki
    networks: [monitoring]
    restart: unless-stopped
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    pid: host
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/var/lib/node_exporter/textfile"]
    volumes:
      - "/:/host:ro,rslave"
      - "/var/lib/node_exporter/textfile:/var/lib/node_exporter/textfile:ro"
    networks: [monitoring]
    restart: unless-stopped
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker:/var/lib/docker:ro"
      - "/dev/disk:/dev/disk:ro"
    networks: [monitoring]
    restart: unless-stopped
    logging: *default-logging

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    command:
      - --mongodb.uri=mongodb://${MONGO_EXPORTER_USER:-exporter}:${MONGO_EXPORTER_PASSWORD:?Set MONGO_EXPORTER_PASSWORD in deploy/.env}@mongo:27017/admin?replicaSet=rs0&authSource=admin
      - --collect-all
    depends_on:
      mongo:
        condition: service_healthy
    networks: [back, monitoring]
    restart: unless-stopped
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
    depends_on:
      redis:
        condition: service_healthy
    networks: [back, monitoring]
    restart: unless-stopped
    logging: *default-logging

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    volumes:
      - kuma-data:/app/data
    networks: [front, back]
    restart: unless-stopped
    logging: *default-logging

networks:
  front:
  back:
    internal: true
  monitoring:
    internal: true

volumes:
  mongo-data:
  mongo-keyfile:
  redis-data:
  inbox-data:
  api-logs:
  nginx-logs:
  nginx-tls:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  promtail-positions:
  kuma-data:
