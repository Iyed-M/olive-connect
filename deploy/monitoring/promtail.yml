server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: oliveconnect-api
    static_configs:
      - targets: [localhost]
        labels:
          job: oliveconnect-api
          service: api
          __path__: /var/log/api/*.json

  - job_name: oliveconnect-nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: oliveconnect-nginx
          service: web
          __path__: /var/log/nginx/*.log
