global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api:8080]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: mongodb
    static_configs:
      - targets: [mongodb-exporter:9216]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
