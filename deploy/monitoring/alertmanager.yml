global:
  resolve_timeout: 5m

route:
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: operations

# Add the team's email or Telegram webhook on the VPS. Keeping the receiver
# empty is valid and makes the local monitoring stack safe by default.
receivers:
  - name: operations
