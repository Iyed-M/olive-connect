proxy_cache_path /var/cache/nginx/map levels=1:2 keys_zone=mapcache:10m max_size=50m inactive=10m;

server {
    listen 80;

    # Folder with the built files (copied there by the Dockerfile).
    root /usr/share/nginx/html;

    # Compress text responses (HTML is already included by default).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite file names contain a content hash, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Anonymous public map: micro-cache for 30 s (the API also caches it in Redis).
    location /api/map/public {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache mapcache;
        proxy_cache_valid 200 30s;
    }

    # Requests to /api/... are forwarded to the Spring Boot container.
    # The path is passed unchanged, so /api/system/status reaches the backend as-is.
    location /api/ {
        client_max_body_size 21m;   # import file upload (the API accepts up to 20 MB)
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths return index.html and the React router takes over.
    location / {
        try_files $uri /index.html;
    }
}
