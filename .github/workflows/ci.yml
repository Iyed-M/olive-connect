# Runs on every pull request and on every push to main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only access to the repository is enough for building and testing.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven            # reuse downloaded Maven dependencies between runs
          cache-dependency-path: backend/pom.xml
      # verify = compile + tests. Testcontainers starts MongoDB and Redis via Docker.
      # -U: re-check releases that a restored ~/.m2 cache marked as "absent" (failed earlier lookups)
      - run: ./mvnw -B -U verify

  frontend:
    name: Frontend (lint, test and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Must come before setup-node: it installs pnpm, and the version is read from package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm            # cache the pnpm store between runs
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile   # fails if the lockfile is out of date
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Compose refuses to read the file without the secrets, even for a build, so use the example values.
      - run: cp deploy/.env.example deploy/.env
      - run: deploy/tests/validate.sh
      # Builds the backend and frontend images exactly as the deployment does.
      - run: docker compose -f deploy/docker-compose.yml build

  e2e:
    name: Playwright release journey
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      E2E_ADMIN_EMAIL: admin@oliveconnect.tn
      E2E_ADMIN_PASSWORD: change-me-too
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: cp deploy/.env.example deploy/.env
      - name: Start the production-shaped stack
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait for the web application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f deploy/docker-compose.yml ps
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm e2e
        working-directory: frontend
      - name: Show compose logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v --remove-orphans
