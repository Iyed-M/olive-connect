spring:
  config:
    activate:
      on-profile: prod
  data:
    mongodb:
      uri: ${MONGO_URI}
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

app:
  jwt-secret: ${JWT_SECRET}
  admin-email: ${ADMIN_EMAIL}
  admin-password: ${ADMIN_PASSWORD}
  imports:
    inbox-dir: ${IMPORT_INBOX_DIR:/data/inbox}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
