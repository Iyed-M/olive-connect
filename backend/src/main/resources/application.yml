spring:
  application:
    name: oliveconnect
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/oliveconnect?directConnection=true}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

# Actuator on the same port, only health and info exposed
management:
  endpoints:
    web:
      exposure:
        include: health,info
